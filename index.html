<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 발음 연습</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1f1d1a;
    --sub: #6b6459;
    --accent: #2a5d63;
    --accent-text: #ffffff;
    --border: #e2ddd3;
    --danger: #b3452e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #232527;
      --text: #ece9e4;
      --sub: #9a958b;
      --accent: #6fbdc4;
      --accent-text: #10282a;
      --border: #34363a;
      --danger: #e08167;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .actions { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.9rem;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.icon { padding: 8px 10px; font-size: 1.05rem; }
  button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  main { max-width: 780px; margin: 0 auto; padding: 20px; }
  section[hidden] { display: none !important; }

  /* Home */
  .set-grid { display: grid; gap: 12px; margin-top: 16px; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer;
  }
  .set-row .meta { font-size: 0.8rem; color: var(--sub); margin-top: 2px; }
  .set-row .row-actions { display: flex; gap: 6px; }
  .empty-hint { color: var(--sub); text-align: center; padding: 40px 10px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Practice */
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .word-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 10px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    user-select: none; min-height: 130px; justify-content: center;
  }
  .word-card .visual { font-size: 2.1rem; line-height: 1; }
  .word-card img.visual { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; font-size: 0; }
  .word-card .word-text { font-weight: 600; font-size: 1.02rem; }
  .word-card .meaning-text { font-size: 0.8rem; color: var(--sub); min-height: 1em; }
  .word-card .meaning-text[hidden] { display: none; }
  .card-actions { display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: 4px; }
  .card-btn {
    width: 100%; padding: 7px 6px; font-size: 0.76rem; border-radius: 9px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); cursor: pointer;
  }
  .card-btn:active { transform: scale(0.96); }
  body.tts-busy .card-btn,
  body.tts-busy .quiz-choice-btn,
  body.tts-busy #btn-quiz-replay {
    pointer-events: none;
    opacity: 0.5;
  }

  /* Editor table */
  .editor-row {
    display: grid; grid-template-columns: 24px 1fr 1fr 1fr 60px 44px 44px 24px;
    gap: 6px; align-items: center; margin-bottom: 6px;
  }
  .editor-row input[type=text] {
    padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 0.85rem; width: 100%;
  }
  .editor-row .idx { color: var(--sub); font-size: 0.8rem; text-align: center; }
  .editor-row .thumb { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
  textarea {
    width: 100%; min-height: 100px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-family: inherit; font-size: 0.9rem; resize: vertical;
  }
  label { font-size: 0.85rem; color: var(--sub); display: block; margin: 14px 0 6px; }
  input[type=text].wide, input[type=password].wide, select.wide {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 0.9rem;
  }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { flex: 1; }
  .tabs button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tabpanel[hidden] { display: none; }
  .status-line { font-size: 0.82rem; color: var(--sub); margin-top: 8px; min-height: 1.2em; }
  .status-line.error { color: var(--danger); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; }
  }
  .modal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 18px 18px 0 0;
    max-width: 520px; width: 100%; padding: 22px; max-height: 88vh; overflow-y: auto;
  }
  @media (min-width: 600px) {
    .modal { border-radius: 18px; }
  }
  .modal h2 { margin-top: 0; font-size: 1.05rem; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .field-row { display: flex; gap: 8px; }
  .field-row > * { flex: 1; }
  .modal hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .rate-row { display: flex; align-items: center; gap: 10px; }
  .rate-row input[type=range] { flex: 1; }

  /* Quiz */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .quiz-progress { font-weight: 600; }
  .quiz-score { color: var(--sub); font-size: 0.85rem; }
  .quiz-audio-area { text-align: center; margin: 24px 0; }
  .quiz-audio-area button { font-size: 1.05rem; padding: 16px 28px; border-radius: 16px; }
  .quiz-choices { display: grid; gap: 10px; }
  .quiz-choice-btn {
    width: 100%; text-align: left; padding: 14px 16px; font-size: 1rem;
    border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text);
  }
  .quiz-choice-btn.correct { background: #2a6b3e; border-color: #2a6b3e; color: #fff; animation: quiz-pop 0.35s ease; }
  .quiz-choice-btn.wrong { background: var(--danger); border-color: var(--danger); color: #fff; }
  .quiz-choice-btn:disabled { cursor: default; opacity: 0.85; }

  .quiz-progress-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; margin: 8px 0 14px; }
  .quiz-progress-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width 0.3s ease; }
  .quiz-timer-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0 0 10px; }
  .quiz-timer-bar[hidden] { display: none; }
  .quiz-timer-fill { height: 100%; background: #e0a72e; width: 100%; }

  @keyframes quiz-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Matching game */
  .match-grid { display: grid; gap: 10px; margin-top: 16px; }
  .match-card {
    aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 1.6rem; cursor: pointer; user-select: none; padding: 4px; text-align: center;
    transition: transform 0.15s ease; overflow: hidden;
  }
  .match-card .m-emoji { font-size: 1.5rem; line-height: 1; }
  .match-card .m-emoji img { width: 100%; max-height: 60%; object-fit: cover; border-radius: 6px; }
  .match-card .m-word { font-size: 0.62rem; font-weight: 600; }
  .match-card.hidden-face { background: var(--accent); color: var(--accent-text); font-size: 1.4rem; }
  .match-card.matched { background: #2a6b3e; border-color: #2a6b3e; color: #fff; cursor: default; }
  .match-card:active:not(.matched) { transform: scale(0.95); }

  .confetti-piece {
    position: fixed; width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 999; top: 0; left: 0;
    animation: confetti-fly 0.9s ease-out forwards;
  }
  @keyframes confetti-fly {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <h1 id="header-title">🇺🇸 발음 연습</h1>
  <div class="actions">
    <button class="icon" id="btn-back" hidden title="뒤로">←</button>
    <button class="icon" id="btn-settings" title="설정">⚙️</button>
  </div>
</header>

<main>

  <section id="view-home">
    <div class="top-actions">
      <button class="primary" id="btn-new-set">+ 새 세트 만들기</button>
    </div>
    <div class="set-grid" id="set-grid"></div>
  </section>

  <section id="view-create" hidden>
    <label for="set-name">세트 이름</label>
    <input type="text" class="wide" id="set-name" placeholder="예: Unit 3 단어">

    <div class="tabs">
      <button class="tab-btn active" data-tab="manual">직접 입력</button>
      <button class="tab-btn" data-tab="ai">AI로 생성</button>
      <button class="tab-btn" data-tab="json">JSON 붙여넣기</button>
    </div>

    <div class="tabpanel" id="tab-manual">
      <label>단어 목록 (한 줄에 한 단어)</label>
      <textarea id="manual-words" placeholder="beautiful&#10;schedule&#10;privacy"></textarea>
      <div class="modal-footer" style="justify-content:flex-start; margin-top:10px;">
        <button id="btn-manual-load">표로 불러오기</button>
      </div>
    </div>

    <div class="tabpanel" id="tab-ai" hidden>
      <label>단어 목록 (한 줄에 한 단어)</label>
      <textarea id="ai-words" placeholder="beautiful&#10;schedule&#10;privacy"></textarea>
      <label style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>AI 프롬프트 (수정 가능)</span>
        <button type="button" id="btn-ai-prompt-reset" style="font-size:0.75rem; padding:4px 8px;">기본값으로</button>
      </label>
      <textarea id="ai-prompt" style="min-height:110px;"></textarea>
      <div class="modal-footer" style="justify-content:flex-start; margin-top:10px;">
        <button class="primary" id="btn-ai-generate">✨ AI로 예문·이모지 생성</button>
      </div>
      <div class="status-line" id="ai-status"></div>
    </div>

    <div class="tabpanel" id="tab-json" hidden>
      <label>JSON 붙여넣기 — 형식: [{"word":"...", "sentence":"...(짧은 예문)", "sentenceLong":"...(긴 예문)", "meaning":"...(한국어 뜻)", "emoji":"..."}]</label>
      <textarea id="json-input" placeholder='[{"word":"beautiful","sentence":"It looks beautiful.","sentenceLong":"The sunset over the hills looked absolutely beautiful this evening.","meaning":"아름다운","emoji":"🌅"}]'></textarea>
      <div class="modal-footer" style="justify-content:flex-start; margin-top:10px;">
        <button id="btn-json-load">표로 불러오기</button>
      </div>
      <div class="status-line" id="json-status"></div>
    </div>

    <label>검토 / 편집</label>
    <div id="editor-rows"></div>
    <button id="btn-add-row">+ 행 추가</button>
    <button id="btn-pull-words" title="아래 표의 단어를 위 단어 목록 입력창으로 올립니다">⬆ 단어 목록으로 올리기</button>

    <div class="modal-footer">
      <button id="btn-cancel-create">취소</button>
      <button class="primary" id="btn-save-set">세트 저장</button>
    </div>
  </section>

  <section id="view-practice" hidden>
    <div class="top-actions">
      <button class="primary" id="btn-start-quiz">🎮 듣고 맞추기</button>
      <button id="btn-start-match">🃏 짝맞추기</button>
      <button id="btn-edit-set">✏️ 편집</button>
      <button id="btn-export-set">⬇ JSON 내보내기</button>
      <button class="danger" id="btn-delete-set">삭제</button>
    </div>
    <p class="status-line">각 카드의 버튼으로 단어 / 짧은 예문 / 긴 예문 발음을 들을 수 있습니다.</p>
    <div class="word-grid" id="word-grid"></div>
  </section>

  <section id="view-quiz" hidden>
    <div id="quiz-play">
      <div class="quiz-top">
        <div class="quiz-progress" id="quiz-progress"></div>
        <div class="quiz-score" id="quiz-score"></div>
      </div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>
      <div class="quiz-timer-bar" id="quiz-timer-bar" hidden><div class="quiz-timer-fill" id="quiz-timer-fill"></div></div>
      <div class="quiz-audio-area">
        <button class="primary" id="btn-quiz-replay">🔊 다시 듣기</button>
      </div>
      <div class="quiz-choices" id="quiz-choices"></div>
      <div class="status-line" id="quiz-feedback"></div>
      <div class="modal-footer">
        <button id="btn-quiz-exit">그만하기</button>
        <button class="primary" id="btn-quiz-next" hidden>다음 ▶</button>
      </div>
    </div>
    <div id="quiz-result" hidden>
      <div class="empty-hint" id="quiz-result-text"></div>
      <div class="modal-footer" style="justify-content:center;">
        <button id="btn-quiz-back-practice">연습으로</button>
        <button class="primary" id="btn-quiz-retry">🔁 다시하기</button>
      </div>
    </div>
  </section>

  <section id="view-match" hidden>
    <div id="match-play">
      <div class="quiz-top">
        <div class="quiz-progress" id="match-progress"></div>
        <div class="quiz-score" id="match-moves"></div>
      </div>
      <p class="status-line" id="match-hint">카드 두 개를 뒤집어 같은 단어끼리 짝을 맞춰보세요.</p>
      <div class="match-grid" id="match-grid"></div>
      <div class="modal-footer">
        <button id="btn-match-exit">그만하기</button>
      </div>
    </div>
    <div id="match-result" hidden>
      <div class="empty-hint" id="match-result-text"></div>
      <div class="modal-footer" style="justify-content:center;">
        <button id="btn-match-back-practice">연습으로</button>
        <button class="primary" id="btn-match-retry">🔁 다시하기</button>
      </div>
    </div>
  </section>

</main>

<div class="modal-backdrop" id="modal-settings" hidden>
  <div class="modal">
    <h2>설정</h2>

    <label>말하기 속도: <span id="rate-value">0.92</span>x</label>
    <div class="rate-row">
      <input type="range" id="setting-rate" min="0.6" max="1.15" step="0.02" value="0.92">
    </div>

    <hr>

    <div class="field-row">
      <div>
        <label style="margin:0 0 4px;">발음 억양</label>
        <select id="setting-ai-accent" class="wide">
          <option value="en-US">미국식</option>
          <option value="en-GB">영국식</option>
        </select>
      </div>
      <div>
        <label style="margin:0 0 4px;">AI 보이스</label>
        <select id="setting-ai-voice-name" class="wide">
          <option value="Kore">Kore</option>
          <option value="Puck">Puck</option>
          <option value="Charon">Charon</option>
          <option value="Fenrir">Fenrir</option>
          <option value="Aoede">Aoede</option>
          <option value="Leda">Leda</option>
        </select>
      </div>
    </div>
    <p class="status-line">AI 음성 호출 실패 시 로컬 음성으로 자동 대체됩니다.</p>

    <hr>

    <label>Ollama API 키 (로컬 Ollama 사용 시 비워둬도 됨)</label>
    <input type="password" class="wide" id="setting-apikey" placeholder="ollama.com/settings/keys 에서 발급">
    <label>모델</label>
    <input type="text" class="wide" id="setting-model" placeholder="gemma4:31b-cloud">
    <p class="status-line">키는 이 브라우저의 localStorage에만 저장됩니다. 외부로 전송되지 않습니다.</p>
    <div class="modal-footer">
      <button class="danger" id="btn-clear-key">키 삭제</button>
      <button id="btn-close-settings">닫기</button>
      <button class="primary" id="btn-save-settings">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-quiz-start" hidden>
  <div class="modal">
    <h2>듣고 맞추기 — 난이도 선택</h2>
    <p class="status-line">모든 단어가 한 번씩 출제됩니다.</p>
    <label style="display:flex; align-items:center; gap:8px; justify-content:center; margin:8px 0 4px; font-size:0.9rem;">
      <input type="checkbox" id="quiz-speed-toggle" style="margin:0;">
      ⏱ 스피드모드 (제한시간 안에 맞추기)
    </label>
    <div class="modal-footer" style="justify-content:stretch; flex-direction:column; gap:10px;">
      <button class="primary" id="btn-quiz-mode-word" style="width:100%;">🔤 단어로 맞추기 (쉬움)<br><span style="font-weight:normal; font-size:0.78rem;">단어 발음을 듣고 고르기</span></button>
      <button class="primary" id="btn-quiz-mode-sentence" style="width:100%;">📝 예문으로 맞추기 (어려움)<br><span style="font-weight:normal; font-size:0.78rem;">예문을 듣고 어떤 단어인지 고르기</span></button>
      <button id="btn-quiz-start-cancel" style="width:100%;">취소</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-match-start" hidden>
  <div class="modal">
    <h2>짝맞추기 — 난이도 선택</h2>
    <div class="modal-footer" style="justify-content:stretch; flex-direction:column; gap:10px;">
      <button class="primary" id="btn-match-mode-word" style="width:100%;">🔤 단어보고 맞추기 (쉬움)<br><span style="font-weight:normal; font-size:0.78rem;">카드에 단어가 보이고 발음도 들려요</span></button>
      <button class="primary" id="btn-match-mode-sound" style="width:100%;">👂 듣고 맞추기 (하드모드)<br><span style="font-weight:normal; font-size:0.78rem;">단어는 안 보이고 소리만 듣고 짝을 기억해서 맞춰요</span></button>
      <button id="btn-match-start-cancel" style="width:100%;">취소</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const LS_SETS = "pronunciation_sets_v1";
  const LS_SETTINGS = "pronunciation_settings_v1";

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function loadSets() {
    try { return JSON.parse(localStorage.getItem(LS_SETS)) || []; }
    catch (e) { return []; }
  }
  function saveSets(sets) { localStorage.setItem(LS_SETS, JSON.stringify(sets)); }
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(LS_SETTINGS)) || {}; }
    catch (e) { return {}; }
  }
  function saveSettings(s) { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  let state = {
    view: "home",
    editingSetId: null,   // set currently open in editor (null = new)
    activeSetId: null,    // set open in practice view
    rows: [],             // editor rows: {id, word, sentence, emoji, image}
  };

  // ---------- View switching ----------
  function showView(name) {
    state.view = name;
    $("#view-home").hidden = name !== "home";
    $("#view-create").hidden = name !== "create";
    $("#view-practice").hidden = name !== "practice";
    $("#view-quiz").hidden = name !== "quiz";
    $("#view-match").hidden = name !== "match";
    $("#btn-back").hidden = name === "home";
    $("#header-title").textContent = name === "home" ? "🇺🇸 발음 연습"
      : name === "create" ? "🇺🇸 세트 만들기"
      : name === "quiz" ? "🇺🇸 " + (getSetById(state.activeSetId)?.name || "") + " · 게임"
      : name === "match" ? "🇺🇸 " + (getSetById(state.activeSetId)?.name || "") + " · 짝맞추기"

  // Adds a word, or merges onto the existing row with the same word
  // (case-insensitive) instead of creating a duplicate. Only non-empty
  // incoming fields overwrite existing ones.
  function upsertRow(data) {
    const word = (data.word || "").trim();
    if (!word) return;
    const key = word.toLowerCase();
    const existing = state.rows.find(r => r.word.trim().toLowerCase() === key);
    if (existing) {
      if (data.sentence) existing.sentence = data.sentence;
      if (data.sentenceLong) existing.sentenceLong = data.sentenceLong;
      if (data.meaning) existing.meaning = data.meaning;
      if (data.emoji) existing.emoji = data.emoji;
      if (data.image) existing.image = data.image;
    } else {
      state.rows.push({
        id: uid(),
        word,
        sentence: data.sentence || "",
        sentenceLong: data.sentenceLong || "",
        meaning: data.meaning || "",
        emoji: data.emoji || "🔤",
        image: data.image || ""
      });
    }
  }

  // ---- AI generation via Ollama cloud API ----
  $("#btn-ai-generate").addEventListener("click", async () => {
    const words = wordsFromTextarea($("#ai-words").value);
    const statusEl = $("#ai-status");
    statusEl.className = "status-line";
    if (words.length === 0) {
      statusEl.textContent = "단어를 먼저 입력하세요.";
      statusEl.className = "status-line error";
      return;
    }
    const settings = loadSettings();
    const btn = $("#btn-ai-generate");
    btn.disabled = true;
    statusEl.textContent = "생성 중...";
    try {
      const schema = {
        type: "object",
        properties: {
          items: {
            type: "array",
            items: {
              type: "object",
              properties: {
                word: { type: "string" },
                sentence: { type: "string" },
                sentenceLong: { type: "string" },
                meaning: { type: "string" },
                emoji: { type: "string" }
              },
              required: ["word", "sentence", "sentenceLong", "meaning", "emoji"]
            }
          }
        },
        required: ["items"]
      };
      const promptText = $("#ai-prompt").value.trim() || DEFAULT_AI_PROMPT;
      saveSettings({ ...settings, aiPrompt: promptText });
      const headers = { "Content-Type": "application/json" };
      if (settings.apiKey) headers["Authorization"] = "Bearer " + settings.apiKey;
      const res = await fetch("/api/chat", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: settings.model || "gemma4:31b-cloud",
          stream: false,
          format: schema,
          messages: [
            {
              role: "system",
              content: promptText
            },
            {
              role: "user",
              content: "Words: " + words.join(", ")
            }
          ]
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 200));
      const data = await res.json();
      const raw = data.message.content.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
      const parsed = JSON.parse(raw);
      let items = [];
      if (Array.isArray(parsed.items)) {
        items = parsed.items;
      } else if (Array.isArray(parsed)) {
        items = parsed;
      } else if (parsed && typeof parsed === "object") {
        items = Object.entries(parsed).map(([word, v]) => ({
          word,
          sentence: (v && v.sentence) || "",
          sentenceLong: (v && v.sentenceLong) || "",
          meaning: (v && v.meaning) || "",
          emoji: (v && v.emoji) || ""
        }));
      }
      items.forEach(item => {
        upsertRow({
          word: String(item.word || ""),
          sentence: String(item.sentence || ""),
          sentenceLong: String(item.sentenceLong || ""),
          meaning: String(item.meaning || ""),
          emoji: String(item.emoji || "")
        });
      });
      renderEditorRows();
      statusEl.textContent = `${items.length}개 생성 완료.`;
    } catch (err) {
      statusEl.textContent = "생성 실패: " + err.message + " — CORS 문제일 수 있습니다. 콘솔을 확인하거나 JSON 붙여넣기 방식을 사용하세요.";
      statusEl.className = "status-line error";
    } finally {
      btn.disabled = false;
    }
  });

  function setTtsBusy(v) {

  function speak(text, onDone) {
    if (ttsBusy) return;
    const settings = loadSettings();

    fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({

        voice: settings.aiVoiceName || "Kore",
        accent: settings.aiAccent || "en-US"
      })
    })
      .then(res => {
        if (!res.ok) throw new Error("TTS HTTP " + res.status);
        return res.blob();
      })
      .then(blob => {
        aiAudioEl = new Audio(URL.createObjectURL(blob));
        aiAudioEl.playbackRate = settings.rate || 0.92;
        aiAudioEl.addEventListener("ended", () => { setTtsBusy(false); if (onDone) onDone(); });
        aiAudioEl.addEventListener("error", () => { setTtsBusy(false); if (onDone) onDone(); });
        aiAudioEl.play();

      .catch(err => {

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }

  // ---- Sound effects (WebAudio, no asset files) ----
  let audioCtx = null;
  function playTone(freqs, dur) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach(f => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur * 0.7;
      });
    } catch (e) { /* audio unsupported, ignore */ }
  }
  function playCorrectSound() { playTone([523.25, 659.25, 783.99], 0.13); }
  function playWrongSound() { playTone([293.66, 246.94], 0.18); }

  // ---- Confetti burst (no asset files) ----
  function confettiBurst(originEl) {
    const rect = originEl.getBoundingClientRect();
    const colors = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#c77dff"];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = (rect.left + rect.width / 2) + "px";
      p.style.top = (rect.top + rect.height / 2) + "px";
      p.style.background = colors[i % colors.length];
      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 70;
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist - 30 + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      document.body.appendChild(p);
      p.addEventListener("animationend", () => p.remove());
    }
  }

  }
  function saveBest(best) { localStorage.setItem(LS_BEST, JSON.stringify(best)); }
  function bestKey(setId, difficulty) { return setId + ":" + difficulty; }

  // ---- Speed-mode question timer ----
  const SPEED_ROUND_MS = 8000;
  let quizTimerTimeout = null;
  function startQuestionTimer() {
    clearTimeout(quizTimerTimeout);
    const bar = $("#quiz-timer-bar");
    const fill = $("#quiz-timer-fill");
    if (!quiz.speedMode) { bar.hidden = true; return; }
    bar.hidden = false;
    fill.style.transition = "none";
    fill.style.width = "100%";
    void fill.offsetWidth;
    fill.style.transition = `width ${SPEED_ROUND_MS}ms linear`;
    fill.style.width = "0%";
    quizTimerTimeout = setTimeout(handleQuizTimeout, SPEED_ROUND_MS);
  }
  function handleQuizTimeout() {
    if (!quiz || quiz.locked) return;
    quiz.locked = true;
    const target = quiz.queue[quiz.index];
    const choicesEl = $("#quiz-choices");
    Array.from(choicesEl.children).forEach(child => {
      child.disabled = true;
      if (child.textContent === target.word) child.classList.add("correct");
    });
    playWrongSound();
    const fb = $("#quiz-feedback");
    fb.textContent = `⏱ 시간 초과! 정답은 "${target.word}" 입니다.`;
    fb.className = "status-line error";
    $("#btn-quiz-next").hidden = false;
  }

  function renderQuizRound() {
    const s = getSetById(quiz.setId);
    const target = quiz.queue[quiz.index];
    quiz.locked = false;

    $("#quiz-progress").textContent = `${quiz.index + 1} / ${quiz.queue.length}`;
    $("#quiz-score").textContent = `⭐ × ${quiz.score}`;
    $("#quiz-progress-fill").style.width = Math.round((quiz.index / quiz.queue.length) * 100) + "%";
    $("#quiz-feedback").textContent = "";
    $("#quiz-feedback").className = "status-line";
    $("#btn-quiz-next").hidden = true;

    const distractorPool = s.words.filter(w => w.id !== target.id);
    const distractors = shuffle(distractorPool).slice(0, Math.min(3, distractorPool.length));
    const options = shuffle([target, ...distractors]);

    const choicesEl = $("#quiz-choices");
    choicesEl.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-choice-btn";
      btn.textContent = opt.word;
      btn.addEventListener("click", () => handleQuizAnswer(opt, target, btn, choicesEl));
      choicesEl.appendChild(btn);
    });

    $("#quiz-timer-bar").hidden = true;
    speak(quizAudioFor(target), () => startQuestionTimer());
  }

  $("#btn-quiz-replay").addEventListener("click", () => {
    if (!quiz) return;
    speak(quizAudioFor(quiz.queue[quiz.index]));
  });

  function handleQuizAnswer(chosen, target, btn, choicesEl) {
    if (quiz.locked) return;
    clearTimeout(quizTimerTimeout);
    quiz.locked = true;
    const correct = chosen.id === target.id;
    if (correct) quiz.score++;

    Array.from(choicesEl.children).forEach(child => {
      child.disabled = true;
      if (child.textContent === target.word) child.classList.add("correct");
      else if (child === btn && !correct) child.classList.add("wrong");
    });

    const fb = $("#quiz-feedback");
    fb.textContent = correct ? "정답이에요! 🎉" : `아쉬워요. 정답은 "${target.word}" 입니다.`;
    fb.className = correct ? "status-line" : "status-line error";

    if (correct) {
      playCorrectSound();
      confettiBurst(btn);
    } else {
      playWrongSound();
    }

    $("#btn-quiz-next").hidden = false;
  }

  $("#btn-quiz-next").addEventListener("click", () => {
    quiz.index++;
    if (quiz.index >= quiz.queue.length) {
      finishQuiz();
    } else {
      renderQuizRound();
    }
  });

  function finishQuiz() {
    clearTimeout(quizTimerTimeout);
    stopSpeaking();
    $("#quiz-progress-fill").style.width = "100%";
    $("#quiz-play").hidden = true;
    $("#quiz-result").hidden = false;
    const total = quiz.queue.length;
    const pct = Math.round((quiz.score / total) * 100);

    const best = loadBest();
    const key = bestKey(quiz.setId, quiz.difficulty);
    const prevBest = best[key];
    const isNewBest = !prevBest || quiz.score > prevBest.score;
    if (isNewBest) {
      best[key] = { score: quiz.score, total, pct };
      saveBest(best);
    }

    const modeLabel = quiz.difficulty === "word" ? "단어 듣기" : "예문 듣기";
    const bestLine = isNewBest && prevBest
      ? `🏆 최고기록 경신! (이전 ${prevBest.score}/${prevBest.total})`
      : isNewBest
      ? `🏆 첫 기록 등록!`
      : `최고기록: ${prevBest.score}/${prevBest.total}`;
    $("#quiz-result-text").innerHTML =
      `🎉 결과: ${quiz.score} / ${total} (${pct}%)<br>` +
      `<span style="font-size:0.85rem;">${modeLabel}${quiz.speedMode ? " · ⏱ 스피드모드" : ""}</span><br>` +
      `<span style="font-size:0.85rem;">${bestLine}</span>`;
    if (isNewBest) confettiBurst($("#quiz-result-text"));
  }

  $("#btn-quiz-exit").addEventListener("click", () => {
    clearTimeout(quizTimerTimeout);
    stopSpeaking();
    renderPractice();
    showView("practice");
  });
  $("#btn-quiz-back-practice").addEventListener("click", () => {
    renderPractice();
    showView("practice");
  });
  $("#btn-quiz-retry").addEventListener("click", () => startQuiz(quiz.difficulty, quiz.speedMode));

  // ---------- Matching game ----------
  let match = null; // { setId, cards:[{id,wordId,type,content,image,word,flippedUp,matched}], flipped, moves, matchedPairs, totalPairs, locked }
  const LS_MATCH_BEST = "pronunciation_match_best_v1";
  const MATCH_MAX_PAIRS = 8;

  function loadMatchBest() {
    try { return JSON.parse(localStorage.getItem(LS_MATCH_BEST)) || {}; }
    catch (e) { return {}; }
  }
  function saveMatchBest(b) { localStorage.setItem(LS_MATCH_BEST, JSON.stringify(b)); }

  // Picks a column count that evenly divides the card total, as close to
  // square as possible, so the grid always fills to a clean rectangle
  // (no lonely leftover card in the last row).
  function bestMatchColumns(total) {
    let cols = Math.ceil(Math.sqrt(total));
    while (total % cols !== 0) cols++;
    return cols;
  }

  $("#btn-start-match").addEventListener("click", () => {
    const s = getSetById(state.activeSetId);
    if (!s || s.words.length < 2) {
      alert("짝맞추기를 하려면 단어가 2개 이상 필요합니다.");
      return;
    }
    $("#modal-match-start").hidden = false;
  });
  $("#btn-match-start-cancel").addEventListener("click", () => $("#modal-match-start").hidden = true);
  $("#btn-match-mode-word").addEventListener("click", () => { $("#modal-match-start").hidden = true; startMatch("word"); });
  $("#btn-match-mode-sound").addEventListener("click", () => { $("#modal-match-start").hidden = true; startMatch("sound"); });

  function startMatch(mode) {
    const s = getSetById(state.activeSetId);
    const words = shuffle(s.words).slice(0, Math.min(MATCH_MAX_PAIRS, s.words.length));
    const cards = [];
    words.forEach(w => {
      for (let i = 0; i < 2; i++) {
        cards.push({ id: uid(), wordId: w.id, word: w.word, emoji: w.emoji || "🔤", image: w.image || "", flippedUp: false, matched: false });
      }
    });
    match = {
      setId: s.id,
      mode,
      cards: shuffle(cards),
      cols: bestMatchColumns(cards.length),
      flipped: [],
      moves: 0,
      matchedPairs: 0,
      totalPairs: words.length,
      locked: false
    };
    $("#match-hint").textContent = mode === "sound"
      ? "👂 하드모드: 카드를 뒤집으면 소리만 들려요. 소리를 기억해서 같은 단어끼리 짝을 맞춰보세요."
      : "카드 두 개를 뒤집어 같은 단어끼리 짝을 맞춰보세요.";
    $("#match-result").hidden = true;
    $("#match-play").hidden = false;
    showView("match");
    renderMatch();
  }

  function renderMatch() {
    $("#match-progress").textContent = `짝: ${match.matchedPairs} / ${match.totalPairs}`;
    $("#match-moves").textContent = `시도: ${match.moves}`;
    const grid = $("#match-grid");
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${match.cols}, 1fr)`;
    match.cards.forEach(c => {
      const el = document.createElement("div");
      el.dataset.wordId = c.wordId;
      el.className = "match-card" + (c.matched ? " matched" : c.flippedUp ? "" : " hidden-face");
      if (c.matched || (c.flippedUp && match.mode === "word")) {
        el.innerHTML =
          `<div class="m-emoji">${c.image ? `<img src="${c.image}">` : escapeHtml(c.emoji)}</div>` +
          `<div class="m-word">${escapeHtml(c.word)}</div>`;
      } else if (c.flippedUp) {
        el.innerHTML = `<div class="m-emoji">🔊</div>`;
      } else {
        el.textContent = "❔";
      }
      if (!c.matched) el.addEventListener("click", () => flipMatchCard(c));
      grid.appendChild(el);
    });
  }

  function flipMatchCard(card) {
    if (match.locked || card.matched || card.flippedUp) return;
    if (match.flipped.length >= 2) return;
    card.flippedUp = true;
    match.flipped.push(card);
    renderMatch();
    speak(card.word);

    if (match.flipped.length === 2) {
      match.moves++;
      const [a, b] = match.flipped;
      if (a.wordId === b.wordId) {
        match.locked = true;
        setTimeout(() => {
          a.matched = true; b.matched = true;
          match.matchedPairs++;
          match.flipped = [];
          match.locked = false;
          playCorrectSound();
          renderMatch();
          confettiBurst($("#match-grid"));
          if (match.matchedPairs >= match.totalPairs) finishMatch();
        }, 350);
      } else {
        match.locked = true;
        playWrongSound();
        setTimeout(() => {
          a.flippedUp = false; b.flippedUp = false;
          match.flipped = [];
          match.locked = false;
          renderMatch();
        }, 700);
      }
    }
  }

  function finishMatch() {
    stopSpeaking();
    $("#match-play").hidden = true;
    $("#match-result").hidden = false;

    const best = loadMatchBest();
    const key = match.setId + ":" + match.totalPairs + ":" + match.mode;
    const prevBest = best[key];
    const isNewBest = !prevBest || match.moves < prevBest.moves;
    if (isNewBest) {
      best[key] = { moves: match.moves, pairs: match.totalPairs };
      saveMatchBest(best);
    }
    const bestLine = isNewBest && prevBest
      ? `🏆 최소시도 경신! (이전 ${prevBest.moves}회)`
      : isNewBest
      ? `🏆 첫 기록 등록!`
      : `최소시도 기록: ${prevBest.moves}회`;
    $("#match-result-text").innerHTML =
      `🎉 모두 맞췄어요! 시도 횟수: ${match.moves}회<br>` +
      `<span style="font-size:0.85rem;">${bestLine}</span>`;
    if (isNewBest) confettiBurst($("#match-result-text"));
  }

  $("#btn-match-exit").addEventListener("click", () => {
    stopSpeaking();
    renderPractice();
    showView("practice");
  });
  $("#btn-match-back-practice").addEventListener("click", () => {
    renderPractice();
    showView("practice");
  });
  $("#btn-match-retry").addEventListener("click", () => startMatch(match.mode));

  // ---------- Settings ----------
  $("#btn-settings").addEventListener("click", () => {
    const s = loadSettings();
    $("#setting-apikey").value = s.apiKey || "";
    $("#setting-model").value = s.model || "gemma4:31b-cloud";
    $("#setting-ai-accent").value = s.aiAccent || "en-US";
    $("#setting-ai-voice-name").value = s.aiVoiceName || "Kore";
    $("#setting-rate").value = s.rate || 0.92;
    $("#rate-value").textContent = (s.rate || 0.92).toFixed(2);
    $("#modal-settings").hidden = false;
  });
  $("#btn-close-settings").addEventListener("click", () => $("#modal-settings").hidden = true);
  $("#btn-save-settings").addEventListener("click", () => {
    saveSettings({
      apiKey: $("#setting-apikey").value.trim(),
      model: $("#setting-model").value.trim() || "gemma4:31b-cloud",
      aiAccent: $("#setting-ai-accent").value,
      aiVoiceName: $("#setting-ai-voice-name").value,
      rate: parseFloat($("#setting-rate").value) || 0.92
    });
    $("#modal-settings").hidden = true;
  });
  $("#btn-clear-key").addEventListener("click", () => {
    const s = loadSettings();
    saveSettings({ ...s, apiKey: "" });
    $("#setting-apikey").value = "";
  });

  // ---------- Init ----------
  const DEFAULT_SET_WORDS = [
    { word: "ask", sentence: "I ask a question.", sentenceLong: "I ask my teacher a question in class.", meaning: "물어보다", emoji: "❓" },
    { word: "an", sentence: "I eat an apple.", sentenceLong: "I eat an apple every day after school.", meaning: "하나의 (모음 앞)", emoji: "🍎" },
    { word: "over", sentence: "It is over there.", sentenceLong: "The cat jumps over the little fence in the yard.", meaning: "위로, 건너서", emoji: "🐱" },
    { word: "just", sentence: "I just woke up.", sentenceLong: "I just finished my homework before dinner tonight.", meaning: "방금, 그냥", emoji: "⏰" },
    { word: "from", sentence: "I am from Korea.", sentenceLong: "My friend is from a small town near the sea.", meaning: "~로부터", emoji: "🌍" },
    { word: "any", sentence: "I don't have any.", sentenceLong: "I don't have any candy left in my bag.", meaning: "어떤, 아무", emoji: "🍬" },
    { word: "how", sentence: "How are you today?", sentenceLong: "How do you make a sandwich for lunch?", meaning: "어떻게", emoji: "🥪" },
    { word: "know", sentence: "I know the answer.", sentenceLong: "I know how to ride my new bike.", meaning: "알다", emoji: "🚲" },
    { word: "put", sentence: "Put the toy away.", sentenceLong: "Please put your shoes by the front door.", meaning: "놓다, 두다", emoji: "👟" },
    { word: "take", sentence: "Take my hand, please.", sentenceLong: "I take my dog for a walk every morning.", meaning: "가지다, 데려가다", emoji: "🐕" },
    { word: "every", sentence: "I brush every morning.", sentenceLong: "I brush my teeth every morning and night.", meaning: "모든, 매~", emoji: "🦷" },
    { word: "old", sentence: "My dog is old.", sentenceLong: "My grandpa is very old and very kind.", meaning: "나이든, 오래된", emoji: "👴" }
  ];
  function seedDefaultSetIfEmpty() {
    if (loadSets().length > 0) return;
    const now = Date.now();
    saveSets([{
      id: uid(),
      name: "테스트 세트",
      words: DEFAULT_SET_WORDS.map(w => ({ id: uid(), word: w.word, sentence: w.sentence, sentenceLong: w.sentenceLong, meaning: w.meaning, emoji: w.emoji, image: "" })),
      createdAt: now,
      updatedAt: now
    }]);
  }
  seedDefaultSetIfEmpty();

  renderHome();
  showView("home");
})();
</script>
</body>
